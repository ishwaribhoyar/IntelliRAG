databases:
  - name: intellirag-postgres
    databaseName: intellirag
    user: intellirag_user
    region: oregon
    plan: free

services:
  - type: web
    name: intellirag
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    healthCheckPath: /health
    # Run from either repo root or backend root defensively
    buildCommand: if [ -d backend ]; then cd backend; fi; python -V && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: if [ -d backend ]; then cd backend; fi; python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: intellirag-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: PIPELINE_MIN_WORKERS
        value: "1"
      - key: PIPELINE_DEFAULT_WORKERS
        value: "3"
      - key: PIPELINE_MAX_WORKERS
        value: "6"
